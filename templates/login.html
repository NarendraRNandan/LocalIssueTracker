{% extends "base.html" %}
{% block title %}Sign In • CivicTrack{% endblock %}
{% block content %}
<div class="auth-page" style="max-width:520px;margin:3rem auto"><div class="card" style="padding:2rem">
  <div class="auth-header"><h1 class="auth-title">Welcome Back</h1><p class="auth-subtitle">Sign in with your registered email. CivicTrack automatically detects whether you are a citizen, worker, authority or administrator.</p></div>
  <form method="POST" action="{{ url_for('login',next=request.args.get('next')) }}">
    <div class="form-group"><label class="form-label">Email Address</label><input type="email" name="email" class="form-control" placeholder="name@domain.com" required autofocus></div>
    <div class="form-group"><label class="form-label">Password</label><input type="password" name="password" class="form-control" placeholder="••••••••" required></div>
    <label style="display:flex;gap:.5rem;align-items:center;margin:1rem 0;color:var(--slate-600)"><input type="checkbox" name="remember" checked> Remember this session</label>
    <button class="btn btn-primary btn-block btn-lg">Sign In to Portal →</button>
  </form>
  <div style="margin-top:1.5rem;text-align:center;color:var(--slate-500)">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></div>
</div></div>
{% endblock %}
