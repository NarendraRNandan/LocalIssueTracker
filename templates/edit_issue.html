{% extends "base.html" %}
{% block title %}Edit {{ issue.case_code }} • CivicTrack{% endblock %}
{% block content %}
<div style="max-width:900px;margin:0 auto"><div class="card" style="padding:1.5rem"><h1 style="font-size:1.6rem;font-weight:800">Edit Application {{ issue.case_code }}</h1><p style="color:var(--slate-500)">Administrator full-control edit. Changes are recorded and the client/assigned participants are notified.</p>
<form method="POST">
<div class="form-group"><label class="form-label">Title</label><input name="title" class="form-control" value="{{ issue.title }}" required></div>
<div class="form-group"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="5" required>{{ issue.description }}</textarea></div>
<div style="display:grid;grid-template-columns:1.3fr 1fr;gap:1rem"><div class="form-group"><label class="form-label">Category</label><select name="category" class="form-select" required>{% for c in CATEGORIES %}<option value="{{ c }}" {% if issue.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div><div class="form-group"><label class="form-label">Priority</label><select name="priority" class="form-select" required>{% for p in PRIORITIES %}<option value="{{ p }}" {% if issue.priority==p %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></div></div>
<div style="background:var(--slate-50);padding:1rem;border-radius:var(--radius-md);border:1px solid var(--border-subtle)"><b>Location</b><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-top:.75rem"><div class="form-group"><label class="form-label">State</label><select name="state" class="form-select cascading-state" required>{% for s in states %}<option value="{{ s }}" {% if issue.state==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div><div class="form-group"><label class="form-label">District</label><select name="district" class="form-select cascading-district" required><option value="{{ issue.district }}">{{ issue.district }}</option></select></div><div class="form-group"><label class="form-label">City / Town</label><select name="city_town" class="form-select cascading-city" required><option value="{{ issue.city_town }}">{{ issue.city_town }}</option></select></div></div><div class="form-group"><label class="form-label">Street / Landmark</label><input name="locality_address" class="form-control" value="{{ issue.locality_address or '' }}"></div></div>
<div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem"><a class="btn btn-secondary" href="{{ url_for('issue_detail',issue_id=issue.id) }}">Cancel</a><button class="btn btn-primary">Save Admin Changes</button></div>
</form></div></div>
{% endblock %}
